<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-adaptive-kit: adaptive layouts for tablets and foldables in Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062320"/>
      <stop offset="1" stop-color="#0b4a42"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6faf9"/>
      <stop offset="1" stop-color="#e8f0ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="166" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="-2">compose-adaptive-kit</text>
    <text x="74" y="218" fill="#c4ece5" font-size="26" font-weight="500">Adaptive layouts for tablets and foldables</text>
    <text x="74" y="252" fill="#c4ece5" font-size="26" font-weight="500">in Jetpack Compose</text>
    <text x="74" y="310" fill="#7dd3c7" font-size="19" font-family="'JetBrains Mono', Menlo, monospace">AdaptiveListDetail(list, detail, selected)</text>
    <g font-size="16" font-weight="600" fill="#e3f6f2">
      <rect x="74" y="340" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="139" y="364" text-anchor="middle">List-detail</text>
      <rect x="214" y="340" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="299" y="364" text-anchor="middle">Supporting pane</text>
      <rect x="394" y="340" width="136" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="462" y="364" text-anchor="middle">Size classes</text>
      <rect x="540" y="340" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="605" y="364" text-anchor="middle">Hinge-aware</text>
    </g>
    <g font-size="16" font-weight="600" fill="#e3f6f2">
      <rect x="74" y="388" width="260" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="204" y="412" text-anchor="middle">Bottom bar · rail · drawer</text>
      <rect x="344" y="388" width="166" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="427" y="412" text-anchor="middle">Predictive back</text>
      <rect x="520" y="388" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="600" y="412" text-anchor="middle">Book · tabletop</text>
    </g>
    <text x="74" y="486" fill="#7dd3c7" font-size="17" font-weight="600" fill-opacity="0.9">Fold and hinge math · Pure Kotlin core · minSdk 24</text>

    <!-- Tablet with three panes -->
    <g transform="translate(700 70)" filter="url(#shadow)">
      <rect width="520" height="330" rx="26" fill="#0f1b19"/>
      <rect x="12" y="12" width="496" height="306" rx="16" fill="url(#screen)"/>
      <!-- drawer -->
      <rect x="22" y="22" width="88" height="286" rx="10" fill="#dcebe7"/>
      <rect x="32" y="36" width="52" height="8" rx="4" fill="#006b5e"/>
      <rect x="32" y="56" width="68" height="18" rx="9" fill="#a6f2e3"/>
      <rect x="32" y="84" width="54" height="8" rx="4" fill="#9fb3ae"/>
      <rect x="32" y="102" width="60" height="8" rx="4" fill="#9fb3ae"/>
      <rect x="32" y="120" width="48" height="8" rx="4" fill="#9fb3ae"/>
      <!-- list -->
      <rect x="118" y="22" width="132" height="286" rx="10" fill="#ffffff"/>
      <g>
        <rect x="126" y="34" width="116" height="38" rx="8" fill="#a6f2e3"/>
        <circle cx="140" cy="53" r="9" fill="#00897b"/>
        <rect x="154" y="45" width="70" height="6" rx="3" fill="#17312c"/>
        <rect x="154" y="56" width="80" height="5" rx="2.5" fill="#5b746e"/>
        <circle cx="140" cy="95" r="9" fill="#5c6bc0"/>
        <rect x="154" y="87" width="62" height="6" rx="3" fill="#17312c"/>
        <rect x="154" y="98" width="76" height="5" rx="2.5" fill="#9fb3ae"/>
        <circle cx="140" cy="133" r="9" fill="#ef6c00"/>
        <rect x="154" y="125" width="70" height="6" rx="3" fill="#17312c"/>
        <rect x="154" y="136" width="72" height="5" rx="2.5" fill="#9fb3ae"/>
        <circle cx="140" cy="171" r="9" fill="#d81b60"/>
        <rect x="154" y="163" width="56" height="6" rx="3" fill="#17312c"/>
        <rect x="154" y="174" width="80" height="5" rx="2.5" fill="#9fb3ae"/>
        <circle cx="140" cy="209" r="9" fill="#7cb342"/>
        <rect x="154" y="201" width="66" height="6" rx="3" fill="#17312c"/>
        <rect x="154" y="212" width="70" height="5" rx="2.5" fill="#9fb3ae"/>
      </g>
      <!-- detail -->
      <rect x="258" y="22" width="148" height="286" rx="10" fill="#ffffff"/>
      <rect x="270" y="38" width="118" height="10" rx="5" fill="#17312c"/>
      <rect x="270" y="56" width="40" height="10" rx="5" fill="#cde8e1"/>
      <rect x="316" y="56" width="50" height="10" rx="5" fill="#cde8e1"/>
      <rect x="270" y="82" width="124" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="270" y="94" width="116" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="270" y="106" width="120" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="270" y="118" width="90" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="270" y="136" width="122" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="270" y="148" width="104" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="270" y="268" width="50" height="20" rx="10" fill="#006b5e"/>
      <rect x="326" y="268" width="56" height="20" rx="10" fill="none" stroke="#6f7976" stroke-width="1.5"/>
      <!-- extra pane -->
      <rect x="414" y="22" width="84" height="286" rx="10" fill="#ffffff"/>
      <rect x="424" y="38" width="62" height="8" rx="4" fill="#17312c"/>
      <circle cx="432" cy="66" r="7" fill="#00897b"/>
      <circle cx="432" cy="86" r="7" fill="#5c6bc0"/>
      <circle cx="432" cy="106" r="7" fill="#8e24aa"/>
      <rect x="444" y="63" width="40" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="444" y="83" width="34" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="444" y="103" width="38" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="424" y="128" width="64" height="24" rx="6" fill="#e0e9e6"/>
      <rect x="424" y="158" width="64" height="24" rx="6" fill="#e0e9e6"/>
      <!-- debug label -->
      <rect x="378" y="284" width="122" height="20" rx="6" fill="#1b1d24" fill-opacity="0.9"/>
      <text x="439" y="298" fill="#ffffff" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">Large · Flat</text>
    </g>

    <!-- Foldable in book posture -->
    <g transform="translate(760 420)" filter="url(#shadow)">
      <path d="M0 8 L170 0 L170 120 L0 128 Z" fill="#0f1b19"/>
      <path d="M8 14 L164 7 L164 113 L8 120 Z" fill="url(#screen)"/>
      <path d="M170 0 L340 8 L340 128 L170 120 Z" fill="#0f1b19"/>
      <path d="M176 7 L332 14 L332 120 L176 113 Z" fill="url(#screen)"/>
      <line x1="170" y1="0" x2="170" y2="120" stroke="#ff5252" stroke-width="3" stroke-opacity="0.8"/>
      <rect x="22" y="24" width="120" height="14" rx="7" fill="#a6f2e3"/>
      <rect x="22" y="48" width="110" height="6" rx="3" fill="#9fb3ae"/>
      <rect x="22" y="62" width="96" height="6" rx="3" fill="#9fb3ae"/>
      <rect x="22" y="76" width="104" height="6" rx="3" fill="#9fb3ae"/>
      <rect x="192" y="24" width="96" height="10" rx="5" fill="#17312c"/>
      <rect x="192" y="44" width="124" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="192" y="56" width="116" height="5" rx="2.5" fill="#9fb3ae"/>
      <rect x="192" y="68" width="120" height="5" rx="2.5" fill="#9fb3ae"/>
      <text x="170" y="-10" fill="#ffb4ab" font-size="13" font-weight="600" text-anchor="middle">split at the hinge</text>
    </g>
  </g>
</svg>
